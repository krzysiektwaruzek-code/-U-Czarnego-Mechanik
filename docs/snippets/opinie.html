<!--
  SEKCJA „OPINIE” — wklej w index.html pomiędzy „O warsztacie” a „Dojazd”.

  ZASADY:
  - Wyłącznie prawdziwe opinie, cytowane dosłownie, z podaniem źródła
    (np. „Opinia z Map Google”) i, jeśli to możliwe, z linkiem do źródła.
  - Nie podawaj ocen ani liczby opinii, jeśli nie da się ich zweryfikować na żywo.
  - Nie dodawaj znaczników schema.org Review / AggregateRating bez zgodności
    z wytycznymi Google dla opinii.
-->
<section class="section" id="opinie" aria-labelledby="reviews-title">
  <div class="container">
    <header class="section__head" data-reveal>
      <p class="eyebrow">Opinie</p>
      <h2 id="reviews-title">Co mówią klienci</h2>
    </header>

    <div class="reviews">
      <blockquote class="quote" data-reveal>
        <p>„TREŚĆ OPINII DOSŁOWNIE.”</p>
        <footer>— AUTOR OPINII · <a href="URL_ŹRÓDŁA" target="_blank" rel="noopener">Źródło</a></footer>
      </blockquote>
    </div>
  </div>
</section>
